name: Security lockfile refresh

on:
  push:
    branches:
      - security/production-hardening
    paths:
      - package.json
      - server/package.json
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/production-hardening

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Refresh web lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts

      - name: Refresh signaling lockfile
        working-directory: server
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts

      - name: Verify production audits
        run: |
          npm audit --omit=dev --audit-level=high
          cd server
          npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current"
            exit 0
          fi
          git commit -m "Refresh lockfiles after security upgrades"
          git push origin HEAD:security/production-hardening
