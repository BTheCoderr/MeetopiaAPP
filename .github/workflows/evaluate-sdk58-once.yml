name: Evaluate SDK 58 native security upgrade (branch only)

on:
  push:
    branches: [meetopia-sdk58-compatibility-20261116]
    paths:
      - '.github/workflows/evaluate-sdk58-once.yml'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/tsconfig.json'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meetopia-sdk58-compatibility-20261116
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Align Expo 58 and React Native 0.88 on evaluation branch
        working-directory: apps/mobile
        run: |
          npm pkg set "dependencies.expo=~58.0.25"
          npm pkg set "dependencies.expo-router=~58.0.31"
          npm pkg set "dependencies.react=19.3.0"
          npm pkg set "dependencies.react-dom=19.3.0"
          npm pkg set "dependencies.react-native=0.88.1"
          npm pkg set "dependencies.react-native-reanimated=~4.7.1"
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          npm ci --no-audit --no-fund --legacy-peer-deps
          npx expo install --fix --npm
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Expo platform exports
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SOCKET_URL: https://meetopia-signaling-v2.onrender.com
        run: |
          npx expo export --platform ios --output-dir dist-ios
          npx expo export --platform android --output-dir dist-android
      - name: Generate clean SDK 58 iOS native project without signing or upload
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Audit SDK 58 mobile runtime dependencies
        working-directory: apps/mobile
        run: npm audit --omit=dev --audit-level=high
      - name: Commit passing SDK evaluation to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json apps/mobile/package-lock.json apps/mobile/ios
          if ! git diff --cached --quiet; then
            git commit -m "Evaluate Expo SDK 58 compatible native dependencies"
            git push origin HEAD:meetopia-sdk58-compatibility-20261116
          fi
