name: Meetopia security dependency refresh

on:
  push:
    branches:
      - security/meetopia-deps-20261013
    paths:
      - package.json
      - server/package.json
      - .github/workflows/security-dependency-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetopia
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/meetopia
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3003
    steps:
      - name: Check out isolated security branch
        uses: actions/checkout@v4
        with:
          ref: security/meetopia-deps-20261013

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Resolve patched web lockfile without major forced upgrades
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts --omit=dev

      - name: Resolve patched signaling lockfile
        working-directory: server
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts

      - name: Install refreshed web dependencies
        run: npm ci

      - name: Verify production web security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build production web application
        run: npm run build

      - name: Check signaling source and tests
        run: |
          node --check server/index.js
          node --test scripts/signaling-access.test.cjs

      - name: Install refreshed signaling dependencies
        working-directory: server
        run: npm ci

      - name: Verify production signaling security audit
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Commit only verified lockfile updates back to the security branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
          else
            git commit -m "Refresh patched Meetopia web and signaling dependency lockfiles"
            git push origin HEAD:security/meetopia-deps-20261013
          fi
