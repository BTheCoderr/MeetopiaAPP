name: One-time refresh of Meetopia lockfiles

on:
  push:
    branches: [meetopia-mobile-current-parity]
    paths:
      - '.github/workflows/refresh-lockfiles-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/meetopia-mobile-current-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Check out parity branch
        uses: actions/checkout@v4
        with:
          ref: meetopia-mobile-current-parity
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Generate web lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate signaling lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Regenerate stale mobile Expo lockfile
        working-directory: apps/mobile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit branch-only lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json apps/mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate web signaling and native lockfiles"
            git push origin HEAD:meetopia-mobile-current-parity
          fi
