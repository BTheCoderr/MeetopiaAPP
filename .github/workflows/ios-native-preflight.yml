name: Meetopia unsigned iOS native preflight

on:
  push:
    branches: [meetopia-mobile-current-parity]
    paths:
      - .github/workflows/ios-native-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ios-simulator:
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      RCT_NEW_ARCH_ENABLED: '1'
      EXPO_PUBLIC_SOCKET_URL: https://meetopia-signaling-v2.onrender.com
    steps:
      - name: Check out pinned draft branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify native toolchain
        run: |
          xcodebuild -version
          ruby --version
          pod --version
      - name: Install locked JavaScript dependencies
        working-directory: apps/mobile
        run: npm ci --no-fund --no-audit
      - name: Install iOS native dependencies
        working-directory: apps/mobile/ios
        run: pod install --repo-update
      - name: Compile unsigned iOS Simulator binary (never upload)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Meetopia.xcworkspace \
            -scheme Meetopia \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/meetopia-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
